repos:
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
- repo: local
  hooks:
  - id: ruff-check
    name: ruff check
    entry: mise exec -- ruff check --fix
    language: system
    types_or: [python, pyi]
  - id: ruff-format
    name: ruff format
    entry: mise exec -- ruff format
    language: system
    types_or: [python, pyi]
  - id: ty-check
    name: ty check
    entry: mise exec -- ty check
    language: system
    pass_filenames: false
  - id: actionlint
    name: actionlint
    entry: mise exec -- actionlint
    language: system
    files: ^\.github/workflows/.*\.ya?ml$
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: trailing-whitespace
  - id: check-ast
  - id: fix-byte-order-marker
  - id: check-case-conflict
  - id: check-docstring-first
  - id: check-merge-conflict
  - id: check-symlinks
  - id: debug-statements
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
