name: Build and test

on:
- push
- pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: jdx/mise-action@v4
      with:
        cache: ${{ !env.ACT }}
    - name: Sync dependencies
      run: uv sync --locked
    - name: Type check
      run: ty check
    - name: Tox
      run: uv run --locked tox --colored no
