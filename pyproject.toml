[project]
name = "ddrr"
version = "3.1.0"
description = "Print request and response headers, body (with pretty-printing), etc."
readme = "README.md"
requires-python = ">=3.8.1,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Deniz Dogan", email = "denizdogan@users.noreply.github.com" },
]
keywords = ["django", "debug", "requests", "responses", "logging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = [
    "Django>=3.2,<4.2",
    "attrs>=22.2,<22.3",
]

[project.optional-dependencies]
xml = ["lxml>=4.9.2,<5"]

[project.urls]
Homepage = "https://github.com/denizdogan/django-debug-requests-responses"
Repository = "https://github.com/denizdogan/django-debug-requests-responses"

[dependency-groups]
dev = [
    { include-group = "test" },
    "black>=23.1,<24",
    "flake8>=6,<7",
    "flake8-black>=0.3.6,<0.4",
    "flake8-bugbear>=23.2.13,<24",
    "flake8-isort>=5.0.3,<6",
    "isort>=5.11.5,<6",
    "pre-commit>=2.21,<3",
    "tox>=4,<5",
    "tox-uv>=1,<2",
]
test = [
    "faker>=17,<18",
    "faker-web>=0.3.1,<0.4",
    "pytest>=7.2.1,<8",
    "pytest-django>=4.5.2,<5",
    "pytest-mock>=3.10,<4",
]
django32 = ["Django~=3.2.0"]
django40 = ["Django~=4.0.0"]
django41 = ["Django~=4.1.0"]

[tool.uv]
conflicts = [
    [
        { group = "django32" },
        { group = "django40" },
        { group = "django41" },
    ],
]

[tool.uv.build-backend]
module-root = ""

[tool.black]
line-length = 79
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
required-version = '23'

[tool.isort]
profile = "black"
force_single_line = true

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"
