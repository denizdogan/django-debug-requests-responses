[project]
name = "ddrr"
version = "3.1.0"
description = "Print request and response headers, body (with pretty-printing), etc."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Deniz Dogan", email = "denizdogan@users.noreply.github.com" },
]
keywords = ["django", "debug", "requests", "responses", "logging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "Django>=5.2,<6.1",
    "attrs>=22.2,<22.3",
]

[project.optional-dependencies]
xml = ["lxml>=5.4,<7"]

[project.urls]
Homepage = "https://github.com/denizdogan/django-debug-requests-responses"
Repository = "https://github.com/denizdogan/django-debug-requests-responses"

[dependency-groups]
dev = [
    { include-group = "test" },
    "pre-commit>=4.6,<5",
    "tox>=4,<5",
    "tox-uv>=1,<2",
]
test = [
    "pytest>=9.1,<10",
    "pytest-django>=4.12,<5",
]
django52 = ["Django~=5.2.0"]
django60 = ["Django~=6.0.0; python_version >= '3.12'"]

[tool.uv]
conflicts = [
    [
        { group = "django52" },
        { group = "django60" },
    ],
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"
